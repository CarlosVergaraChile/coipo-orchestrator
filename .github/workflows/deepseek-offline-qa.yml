name: DeepSeek adapter - offline QA
on:
  pull_request:
    paths:
      - "integrations/deepseek_adapter.py"
      - "tests/test_deepseek_adapter.py"
      - ".github/workflows/deepseek-offline-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas simuladas sin claves ni red
        run: python -m unittest discover -s tests -p 'test_deepseek_adapter.py' -v
      - name: Dry run de ejemplo
        run: python integrations/deepseek_adapter.py --prompt 'Caso sintético: 8 de 10 tareas' | python -m json.tool
