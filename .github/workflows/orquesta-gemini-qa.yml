name: Orquesta Gemini - prueba sintetica
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Numero del issue sintetico
        required: true
        type: number
permissions:
  issues: write
concurrency:
  group: orquesta-gemini-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  roundtrip:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.title == '[QA Orquesta] Prueba desde Zapier' && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar issue y comprobar respuesta previa
        id: preflight
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          api="repos/$GITHUB_REPOSITORY/issues/$ISSUE"
          gh api "$api" --jq 'select(.pull_request == null and (.title | startswith("[QA Orquesta]"))) | .number' | grep -Fxq "$ISSUE"
          done=$(gh api "$api/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]") | .body | select(startswith("<!-- orquesta-gemini-qa-v1 -->"))' )
          if [[ -z "$done" ]]; then
            echo 'send=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Enviar caso sintetico y publicar resultado
        if: steps.preflight.outputs.send == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          echo 'Consultando modelos disponibles'
          models=$(curl --fail --silent --show-error --retry 1 --retry-delay 3 --retry-max-time 70 --max-time 30 \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=100' \
            -H "x-goog-api-key: $GEMINI_API_KEY")
          model=$(jq -er '[.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name | select(test("^models/gemini-[0-9.]+-flash(-lite)?$"))] | sort_by([endswith("-lite"), .]) | last // error("No hay un modelo Gemini Flash disponible para esta clave")' <<< "$models")
          echo "Solicitando respuesta a $model"
          curl --fail --silent --show-error --retry 1 --retry-delay 3 --retry-max-time 70 --max-time 25 \
            "https://generativelanguage.googleapis.com/v1beta/${model}:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            --data '{"contents":[{"parts":[{"text":"Caso sintético. Un equipo completó 8 de 10 tareas. Informa el porcentaje en una oración en español."}]}],"generationConfig":{"maxOutputTokens":512}}' > "$RUNNER_TEMP/orquesta.json"
          {
            printf '<!-- orquesta-gemini-qa-v1 -->\n'
            printf 'Prueba sintética de Gemini · [ejecución](%s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            jq -er '[.candidates[0].content.parts[] | .text // empty] | join("\n") | select(length > 0)' "$RUNNER_TEMP/orquesta.json"
          } > "$RUNNER_TEMP/orquesta-response.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/orquesta-response.md"
