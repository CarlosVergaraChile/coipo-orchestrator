name: Orquesta - contrato y dry run
on:
  pull_request:
    paths:
      - "integrations/dispatch_ai.py"
      - "tests/test_dispatch_contract.py"
      - ".github/workflows/orquesta-contract-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas del contrato sin servicios externos
        run: python -m unittest discover -s tests -p 'test_dispatch_contract.py' -v
      - name: Comprobar dry-run Gemini
        run: |
          python integrations/dispatch_ai.py --provider gemini --issue 15 --prompt 'Caso sintético: 8 de 10 tareas completadas' > /tmp/dispatch.json
          python - <<'PY'
          import json
          with open('/tmp/dispatch.json') as f: data=json.load(f)
          assert data['mode']=='dry-run'
          assert data['payload']['task_id']=='CarlosVergaraChile/coipo-orchestrator#15:gemini'
          print('Dry-run verificado: no se envió solicitud externa')
          PY
